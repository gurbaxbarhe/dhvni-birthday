<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>for my baby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/bundle.enc" as="fetch" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="bg-hearts" class="bg-hearts" aria-hidden="true"></div>

    <!-- ───────── Password gate ───────── -->
    <section id="gate" class="screen is-active">
      <div class="box gate-card">
        <span class="px-heart big"></span>
        <h1 id="gate-title" class="title"></h1>
        <p id="gate-subtitle" class="sub"></p>
        <form id="gate-form" class="gate-form" autocomplete="off">
          <input
            id="gate-input"
            type="password"
            placeholder="password"
            aria-label="password"
            required
          />
          <button id="gate-button" type="submit" class="btn"></button>
        </form>
        <p id="gate-error" class="gate-error" role="alert"></p>
      </div>
    </section>

    <!-- ───────── Screen 1: landing ───────── -->
    <section id="landing" class="screen">
      <div class="landing-inner">
        <h1 id="landing-title" class="title xl"></h1>
        <p class="accent"><span id="landing-subtitle"></span> <span class="px-heart"></span></p>

        <div class="face">
          <img id="face-img" alt="" />
        </div>

        <button id="envelope" class="envelope" aria-label="open the envelope">
          <span class="env-back"></span>
          <span class="env-letter"><span class="px-heart"></span></span>
          <span class="env-flap"></span>
          <span class="env-front"></span>
          <span class="env-seal"><span class="px-heart white"></span></span>
        </button>
        <p class="hint"><span class="cursor">▶</span> <span id="envelope-hint"></span></p>
      </div>
    </section>

    <!-- ───────── Screen 2: card ───────── -->
    <section id="card" class="screen">
      <div class="box paper">
        <div class="avatar"><img id="card-face-img" alt="" /></div>
        <span id="card-badge" class="badge"></span>
        <h2 id="card-title" class="title"></h2>
        <p class="accent"><span id="card-name"></span> <span class="px-heart"></span></p>
        <div class="divider"><span class="px-heart"></span></div>
        <p id="card-note" class="note"></p>

        <p id="song-label" class="label"></p>
        <div class="player">
          <a id="spotify-fallback" class="player-fallback" target="_blank" rel="noopener">
            <span id="spotify-fallback-title" class="player-fallback-title"></span>
            <span class="player-fallback-action">open in spotify ▶</span>
          </a>
          <iframe
            id="spotify"
            title="Dedicated song"
            frameborder="0"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          ></iframe>
        </div>
        <p id="song-caption" class="caption"></p>

        <button id="to-things" class="btn"></button>
      </div>
    </section>

    <!-- ───────── Screen 3: things I love about you ───────── -->
    <section id="things" class="screen">
      <div class="things-inner">
        <span class="badge">things i love</span>
        <h2 id="things-title" class="title"></h2>
        <p id="things-subtitle" class="sub"></p>

        <div class="carousel">
          <button id="prev" class="arrow" aria-label="previous">◀</button>
          <div class="card-stage">
            <article id="thing-card" class="box thing-card">
              <div id="thing-photos" class="thing-photos"></div>
              <p id="thing-index" class="thing-index"></p>
              <p id="thing-text" class="thing-text"></p>
            </article>
          </div>
          <button id="next" class="arrow" aria-label="next">▶</button>
        </div>
        <div id="dots" class="dots"></div>

        <button id="to-letter" class="btn"></button>
      </div>
    </section>

    <!-- ───────── Screen 4: the letter ───────── -->
    <section id="letter" class="screen">
      <div class="box paper paper-letter">
        <span id="letter-badge" class="badge"></span>
        <span class="px-heart big"></span>
        <p id="letter-kicker" class="kicker"></p>
        <h2 id="letter-greeting" class="title"></h2>
        <div class="divider"><span class="px-heart"></span></div>
        <div id="letter-body" class="letter-body"></div>
        <p id="letter-signoff" class="accent signoff"></p>
        <p id="letter-signature" class="signature"></p>
        <button id="to-start" class="btn btn-ghost">back to the start</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
